name: CI - Build & Test

on:
  push:
    branches: 
      - main
      - dev
      - test-gh-actions 
  pull_request:
    branches: 
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build solution
      run: dotnet build --no-restore --configuration Release

    - name: Install ReportGenerator tool
      run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.*

    - name: Run tests with coverage
      run: |
        dotnet test \
          --configuration Release \
          /p:CollectCoverage=true \
          /p:CoverletOutputFormat=cobertura \
          /p:CoverletOutput=$(pwd)/TestResults/coverage/ \
          --no-build --verbosity normal

    - name: Generate coverage report
      run: |
        reportgenerator \
          -reports:TestResults/coverage/coverage.cobertura.xml \
          -targetdir:coverage-report \
          -reporttypes:TextSummary

    - name: Show coverage in GitHub Summary
      run: |
        echo "### Code Coverage" >> $GITHUB_STEP_SUMMARY
        cat coverage-report/Summary.txt >> $GITHUB_STEP_SUMMARY

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage-report

      
name: CI/CD - Test, Build, Push, Deploy

on:
  push:
    branches: 
      - main
      - dev
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches: 
      - main
      - dev

env:
  IMAGE_NAME: products-microservice

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build solution
      run: dotnet build --no-restore --configuration Release

    - name: Install ReportGenerator tool
      run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.*

    - name: Run tests with coverage
      run: |
        dotnet test \
          --configuration Release \
          /p:CollectCoverage=true \
          /p:CoverletOutputFormat=cobertura \
          /p:CoverletOutput=$(pwd)/TestResults/coverage/ \
          --no-build --verbosity normal

    - name: Generate coverage report
      run: |
        reportgenerator \
          -reports:TestResults/coverage/coverage.cobertura.xml \
          -targetdir:coverage-report \
          -reporttypes:TextSummary

    - name: Show coverage in GitHub Summary
      run: |
        echo "### Code Coverage" >> $GITHUB_STEP_SUMMARY
        cat coverage-report/Summary.txt >> $GITHUB_STEP_SUMMARY

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage-report

      
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: test

    if: |
      github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
            creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and Push Docker image
        run: |
          ACR_IMAGE_NAME=${{ secrets.ACR_NAME }}.azurecr.io/$IMAGE_NAME
          BRANCH_TAG=${{ github.ref_name }}
          UNIQUE_TAG=${{ github.run_number }}

          docker build -f eCommerce.ProductsService.API/Dockerfile \
            -t $ACR_IMAGE_NAME:$BRANCH_TAG \
            -t $ACR_IMAGE_NAME:$BRANCH_TAG-build-$UNIQUE_TAG .

          docker push $ACR_IMAGE_NAME:$BRANCH_TAG
          docker push $ACR_IMAGE_NAME:$BRANCH_TAG-build-$UNIQUE_TAG


  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build-and-push

    if: |
      github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')

    steps:
      - name: Checkout (for kubectl manifests access)
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials --resource-group ${{ secrets.AKS_RESOURCE_GROUP }} --name ${{ secrets.AKS_CLUSTER_NAME }} --overwrite-existing
        env:
          AZURE_CORE_DISABLE_CONNECTION_VERIFICATION: 'true'

      - name: Ensure namespace exists
        run: |
          if [ "${GITHUB_REF#refs/heads/}" = "main" ]; then
            NS="ecommerce-main"
          else
            NS="ecommerce-dev"
          fi
          kubectl get ns ${NS} || kubectl create ns ${NS}
          echo "KUBE_NAMESPACE=${NS}" >> $GITHUB_ENV

      - name: Deploy - update image in existing Deployment or create new Deployment
        run: |
          IMAGE_TAG=${{ github.ref_name }}-build-${{ github.run_number }}
          sed "s|ecommercewebacr.azurecr.io/products-microservice:latest|ecommercewebacr.azurecr.io/products-microservice:${IMAGE_TAG}|g" k8s/products-deployment.yaml \
            | kubectl -n ${KUBE_NAMESPACE} apply -f -
          kubectl -n ${KUBE_NAMESPACE} apply -f k8s/products-service.yaml

      - name: Wait rollout
        run: |
          DEPLOYMENT_NAME="products-deployment"
          kubectl -n ${KUBE_NAMESPACE} rollout status deployment/${DEPLOYMENT_NAME} --timeout=180s
